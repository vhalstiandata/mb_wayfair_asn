name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # For Workload Identity Federation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Deploy Function 1 - Accept & Create SO
        run: |
          gcloud run deploy wayfair-accept-so \
            --source ./function1_accept_so \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "\
              NS_CONSUMER_KEY=${{ secrets.NS_CONSUMER_KEY }},\
              NS_CONSUMER_SECRET=${{ secrets.NS_CONSUMER_SECRET }},\
              NS_TOKEN=${{ secrets.NS_TOKEN }},\
              NS_TOKEN_SECRET=${{ secrets.NS_TOKEN_SECRET }},\
              NS_REALM=${{ secrets.NS_REALM }},\
              NS_CUSTOMER_ID=${{ secrets.NS_CUSTOMER_ID }},\
              NS_SUBSIDIARY_ID=${{ secrets.NS_SUBSIDIARY_ID }},\
              NS_DEFAULT_LOCATION=${{ secrets.NS_DEFAULT_LOCATION }},\
              WF_CLIENT_ID=${{ secrets.WF_CLIENT_ID }},\
              WF_CLIENT_SECRET=${{ secrets.WF_CLIENT_SECRET }},\
              WF_SUPPLIER_ID=${{ secrets.WF_SUPPLIER_ID }},\
              WF_GQL_URL=${{ secrets.WF_GQL_URL }},\
              BQ_PROJECT_ID=${{ secrets.BQ_PROJECT_ID }},\
              BQ_MAP_TABLE=${{ secrets.BQ_MAP_TABLE }},\
              MAX_ORDERS_PER_RUN=20" \
            --memory 512Mi \
            --timeout 540 \
            --max-instances 10
      
      - name: Deploy Function 2 - Ship ASN
        run: |
          gcloud run deploy wayfair-ship-asn \
            --source ./function2_ship_asn \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "\
              NS_CONSUMER_KEY=${{ secrets.NS_CONSUMER_KEY }},\
              NS_CONSUMER_SECRET=${{ secrets.NS_CONSUMER_SECRET }},\
              NS_TOKEN=${{ secrets.NS_TOKEN }},\
              NS_TOKEN_SECRET=${{ secrets.NS_TOKEN_SECRET }},\
              NS_REALM=${{ secrets.NS_REALM }},\
              WF_CLIENT_ID=${{ secrets.WF_CLIENT_ID }},\
              WF_CLIENT_SECRET=${{ secrets.WF_CLIENT_SECRET }},\
              WF_SUPPLIER_ID=${{ secrets.WF_SUPPLIER_ID }},\
              WF_GQL_URL=${{ secrets.WF_GQL_URL }}" \
            --memory 256Mi \
            --timeout 540 \
            --max-instances 10
      
      - name: Get Service URLs
        id: urls
        run: |
          FUNCTION1_URL=$(gcloud run services describe wayfair-accept-so --region ${{ env.REGION }} --format 'value(status.url)')
          FUNCTION2_URL=$(gcloud run services describe wayfair-ship-asn --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Function 1 URL: $FUNCTION1_URL"
          echo "Function 2 URL: $FUNCTION2_URL"
          echo "function1_url=$FUNCTION1_URL" >> $GITHUB_OUTPUT
          echo "function2_url=$FUNCTION2_URL" >> $GITHUB_OUTPUT
      
      - name: Test deployments
        run: |
          echo "Testing Function 1..."
          curl -f -X POST ${{ steps.urls.outputs.function1_url }} || echo "Warning: Function 1 test failed"
          
          echo "Testing Function 2..."
          curl -f -X POST ${{ steps.urls.outputs.function2_url }} || echo "Warning: Function 2 test failed"
      
      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "Function 1 (Accept & Create SO): ${{ steps.urls.outputs.function1_url }}"
          echo "Function 2 (Ship ASN): ${{ steps.urls.outputs.function2_url }}"
          echo ""
          echo "Next steps:"
          echo "1. Verify Cloud Scheduler jobs are configured"
          echo "2. Check logs: gcloud run logs read SERVICE_NAME --limit=50"
          echo "3. Monitor: https://console.cloud.google.com/run"
